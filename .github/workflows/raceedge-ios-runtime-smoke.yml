name: RaceEdge iOS Runtime Smoke

on:
  push:
    branches: [raceedge]
    paths:
      - 'raceedge/ios/**'
      - '.github/workflows/raceedge-ios-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choose iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x for runtime in d["devices"].values() for x in runtime if x.get("isAvailable") and "iPhone" in x.get("name","")]; print(xs[-1]["udid"] if xs else "")')"
          test -n "$device"
          echo "SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
          echo "Using simulator $device"

      - name: Boot simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" || true
          open -a Simulator || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build RaceEdge for simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project raceedge/ios/RaceEdge.xcodeproj             -scheme RaceEdge             -configuration Debug             -sdk iphonesimulator             -destination "id=$SIMULATOR_UDID"             -derivedDataPath "$RUNNER_TEMP/RaceEdgeDerivedData"             CODE_SIGNING_ALLOWED=NO             build | xcpretty

      - name: Install and launch RaceEdge
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/RaceEdgeDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'RaceEdge.app' -print -quit)"
          test -n "$app"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          xcrun simctl launch "$SIMULATOR_UDID" au.com.raceedge.app
          sleep 12
          pid="$(xcrun simctl spawn "$SIMULATOR_UDID" launchctl print system 2>/dev/null | grep -F 'au.com.raceedge.app' || true)"
          test -n "$pid"

      - name: Capture launch screenshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raceedge-runtime"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/raceedge-runtime/raceedge-launch.png"

      - name: Upload runtime screenshot
        uses: actions/upload-artifact@v4
        with:
          name: raceedge-ios-runtime-screenshot
          path: ${{ runner.temp }}/raceedge-runtime/raceedge-launch.png
          if-no-files-found: error
