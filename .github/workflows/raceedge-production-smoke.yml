name: RaceEdge Production Smoke

on:
  push:
    branches: [raceedge]
    paths:
      - 'raceedge/**'
      - '.github/workflows/raceedge-production-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Resolve deployable RaceEdge commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git log -1 --format=%H -- raceedge)"
          test -n "$sha"
          echo "EXPECTED_RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "Expecting Railway release $sha"

      - name: Wait for expected or newer production deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://raceedge-v1-production.up.railway.app"
          for i in {1..30}; do
            if body="$(curl -fsS --max-time 10 "$base/health" 2>/dev/null)"; then
              actual="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("releaseSha") or "")' "$body")"
              if [ -n "$actual" ]; then
                git fetch origin raceedge --quiet --depth=100 || true
                if git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" "$actual" 2>/dev/null; then
                  echo "Production release $actual contains expected RaceEdge commit $EXPECTED_RELEASE_SHA"
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Production never reached expected RaceEdge commit $EXPECTED_RELEASE_SHA or a newer descendant"
          exit 1

      - name: Verify health and configured services
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS https://raceedge-v1-production.up.railway.app/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"providerConfigured":true'
          echo "$body" | grep -q '"adminConfigured":true'
          echo "$body" | grep -q '"version":"1.0.0"'
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); p=(d.get("providerPlan") or "").lower(); allowed=d.get("priceDisplayAllowed"); assert (p not in ("free","hobby","standard","business","unlimited")) or allowed is False' "$body"

      - name: Verify production does not serve demo content
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://raceedge-v1-production.up.railway.app/api/v1/home -o /tmp/home.json
          curl -fsS https://raceedge-v1-production.up.railway.app/api/v1/tips -o /tmp/tips.json
          python3 -c 'import json; h=json.load(open("/tmp/home.json")); t=json.load(open("/tmp/tips.json")); assert h.get("source")=="production"; assert h.get("meetings")==[]; assert h.get("tips")==[]; assert t.get("source") in ("production","published"); assert t.get("source")!="production" or t.get("tips")==[]'

      - name: Verify public release pages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://raceedge-v1-production.up.railway.app/privacy.html | grep -q 'RACEEDGE Privacy Policy'
          curl -fsS https://raceedge-v1-production.up.railway.app/support.html | grep -q 'RACEEDGE Support'

      - name: Verify public release status contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://raceedge-v1-production.up.railway.app/api/v1/release-status -o /tmp/release-status.json
          python3 -c 'import json; d=json.load(open("/tmp/release-status.json")); assert d.get("version")=="1.0.0"; assert d.get("production") is True; s=d.get("v1Scope") or {}; assert s.get("thoroughbred") is True and s.get("greyhound") is True and s.get("harnessExposed") is False and s.get("wagering") is False; b=d.get("backend") or {}; assert all(b.get(k) is True for k in ("database","providerConfigured","liveFeed","scratchings","analysis","rateLimit","securityHeaders")); i=d.get("ios") or {}; assert all(i.get(k) is True for k in ("project","simulatorBuild","unsignedReleaseArchive","privacyManifest","productionApi"))'


      - name: Verify public live feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://raceedge-v1-production.up.railway.app/api/v1/live/today -o /tmp/live.json
          python3 -c 'import json,datetime; d=json.load(open("/tmp/live.json")); e=d.get("events"); assert isinstance(e,list) and e; r=[x for m in e for x in (m.get("races") or [])]; assert r; ms=[m.get("meeting") or {} for m in e]; mc=sum(1 for x in ms if x.get("providerId") and x.get("name") and x.get("code"))/len(ms); rc=sum(1 for x in r if x.get("providerId") and x.get("raceNo") and x.get("startTime"))/len(r); ts=[x.get("startTime") for x in r if x.get("startTime")]; u=[x for rr in r for x in (rr.get("runners") or [])]; assert u; provider_ids=sum(1 for x in u if x.get("providerId")); matchable=sum(1 for x in u if x.get("providerId") or (x.get("number") is not None and x.get("name"))); pc=provider_ids/len(u); uc=matchable/len(u); tc=len(ts)/len(r); codes=sorted(set(x.get("code") for x in ms if x.get("code"))); stats={"events":len(e),"races":len(r),"runners":len(u),"meetingIdentityCoverage":round(mc,4),"raceIdentityCoverage":round(rc,4),"runnerProviderIdCoverage":round(pc,4),"runnerMatchIdentityCoverage":round(uc,4),"startTimeCoverage":round(tc,4),"codes":codes,"pricedRunners":sum(1 for x in u if x.get("price") is not None),"analysisReadyRaces":sum(1 for x in r if x.get("analysisReady") is True),"analysisSummary":d.get("analysisSummary"),"priceDisplayAllowed":d.get("priceDisplayAllowed"),"scratchingsChecked":d.get("scratchingsChecked")}; print(json.dumps(stats)); assert mc>=0.95; assert rc>=0.95; assert tc>=0.95; assert uc>=0.95; [datetime.datetime.fromisoformat(x.replace("Z","+00:00")) for x in ts]; assert "R" in codes or "G" in codes; assert d.get("priceDisplayAllowed") is not False or all(x.get("price") is None for x in u)'

      - name: Verify protected routes reject anonymous access
        shell: bash
        run: |
          set -euo pipefail
          provider_code="$(curl -sS -o /tmp/provider.json -w '%{http_code}' https://raceedge-v1-production.up.railway.app/api/v1/provider/status)"
          admin_code="$(curl -sS -o /tmp/admin.json -w '%{http_code}' https://raceedge-v1-production.up.railway.app/api/v1/admin/system)"
          test "$provider_code" = "401"
          test "$admin_code" = "401"

      - name: Verify security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSI https://raceedge-v1-production.up.railway.app/health | tr -d '\r')"
          echo "$headers"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff$'
          echo "$headers" | grep -qi '^x-frame-options: DENY$'
          echo "$headers" | grep -qi '^referrer-policy: no-referrer$'
          echo "$headers" | grep -qi '^content-security-policy:'
