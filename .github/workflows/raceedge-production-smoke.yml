name: RaceEdge Production Smoke

on:
  push:
    branches: [raceedge]
    paths:
      - 'raceedge/**'
      - '.github/workflows/raceedge-production-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://raceedge-v1-production.up.railway.app"
          for i in {1..30}; do
            if body="$(curl -fsS --max-time 10 "$base/health" 2>/dev/null)"; then
              if python3 - "$GITHUB_SHA" "$body" <<'PY'
import json,sys
expected=sys.argv[1]
data=json.loads(sys.argv[2])
raise SystemExit(0 if data.get('ok') is True and data.get('releaseSha') == expected else 1)
PY
              then
                echo "Production is running commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production did not deploy commit $GITHUB_SHA"
          exit 1

      - name: Verify health and configured services
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS https://raceedge-v1-production.up.railway.app/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"providerConfigured":true'
          echo "$body" | grep -q '"adminConfigured":true'

      - name: Verify production does not serve demo content
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl -fsS https://raceedge-v1-production.up.railway.app/api/v1/home)"
          tips="$(curl -fsS https://raceedge-v1-production.up.railway.app/api/v1/tips)"
          python3 - "$home" "$tips" <<'PY'
          import json,sys
          home=json.loads(sys.argv[1])
          tips=json.loads(sys.argv[2])
          assert home.get('source') == 'production', home
          assert home.get('meetings') == [], home
          assert home.get('tips') == [], home
          assert tips.get('source') in ('production','published'), tips
          if tips.get('source') == 'production':
              assert tips.get('tips') == [], tips
          PY

      - name: Verify public release pages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://raceedge-v1-production.up.railway.app/privacy.html | grep -q 'RACEEDGE Privacy Policy'
          curl -fsS https://raceedge-v1-production.up.railway.app/support.html | grep -q 'RACEEDGE Support'

      - name: Verify public live feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://raceedge-v1-production.up.railway.app/api/v1/live/today -o /tmp/live.json
          python3 - <<'PY'
          import json
          with open('/tmp/live.json') as f:
              data=json.load(f)
          events=data.get('events')
          assert isinstance(events,list) and len(events)>0, 'live events must be non-empty'
          races=[r for e in events for r in (e.get('races') or [])]
          assert races, 'live races must be non-empty'
          meetings=[e.get('meeting') or {} for e in events]
          assert any(m.get('providerId') and m.get('name') and m.get('code') for m in meetings), 'meeting identity missing'
          assert any(r.get('providerId') and r.get('raceNo') and r.get('startTime') for r in races), 'race identity missing'
          runners=[runner for r in races for runner in (r.get('runners') or [])]
          assert runners, 'live runner fields must be non-empty'
          assert any((runner.get('number') is not None) and runner.get('name') for runner in runners), 'runner identity missing'
          print(json.dumps({
              'events':len(events),
              'races':len(races),
              'runners':len(runners),
              'pricedRunners':sum(1 for x in runners if x.get('price') is not None),
              'scratchingsChecked':data.get('scratchingsChecked')
          }))
          PY

      - name: Verify protected routes reject anonymous access
        shell: bash
        run: |
          set -euo pipefail
          provider_code="$(curl -sS -o /tmp/provider.json -w '%{http_code}' https://raceedge-v1-production.up.railway.app/api/v1/provider/status)"
          admin_code="$(curl -sS -o /tmp/admin.json -w '%{http_code}' https://raceedge-v1-production.up.railway.app/api/v1/admin/system)"
          test "$provider_code" = "401"
          test "$admin_code" = "401"

      - name: Verify security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSI https://raceedge-v1-production.up.railway.app/health | tr -d '\r')"
          echo "$headers"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff$'
          echo "$headers" | grep -qi '^x-frame-options: DENY$'
          echo "$headers" | grep -qi '^referrer-policy: no-referrer$'
          echo "$headers" | grep -qi '^content-security-policy:'
