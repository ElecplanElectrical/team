name: RaceEdge Portal Browser QA

on:
  push:
    branches: [raceedge]
    paths:
      - 'raceedge/public/**'
      - 'raceedge/server.js'
      - '.github/workflows/raceedge-portal-browser-qa.yml'
      - 'raceedge/test/portal-production.mjs'
  workflow_dispatch:

jobs:
  portal-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for RaceEdge production release
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS --max-time 10 https://raceedge-v1-production.up.railway.app/health >/tmp/health.json 2>/dev/null; then
              if grep -q '"ok":true' /tmp/health.json; then
                exit 0
              fi
            fi
            sleep 10
          done
          exit 1

      - name: Exercise desktop and mobile portal
        env:
          RACEEDGE_BASE_URL: https://raceedge-v1-production.up.railway.app
        run: node raceedge/test/portal-production.mjs

      - name: Upload portal QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceedge-portal-browser-qa
          path: |
            /tmp/raceedge-desktop.png
            /tmp/raceedge-mobile.png
          if-no-files-found: ignore
