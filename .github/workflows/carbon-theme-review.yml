name: Recessed Carbon review
on:
  push:
    branches: [feat/elecplan-recessed-carbon-portal]
permissions:
  contents: read
jobs:
  theme-review:
    if: github.ref == 'refs/heads/feat/elecplan-recessed-carbon-portal'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elecplan_ci
      AUTH_SECRET: ci-only-placeholder-secret
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed design 10 source
        shell: python
        run: |
          from pathlib import Path
          import hashlib, zipfile
          bundle=Path('.github/recessed-carbon-source.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == 'e307307295f68c205d017f63c74d4013ebdecf2b33dd3a490be695204371081b'
          allowed={'elecplan-scaffold/src/styles/recessed-carbon.css','elecplan-scaffold/src/lib/carbon-theme.ts','elecplan-scaffold/src/components/CarbonNavigation.tsx','elecplan-scaffold/src/components/Sidebar.tsx','elecplan-scaffold/src/components/MobileNav.tsx','elecplan-scaffold/scripts/migrate-recessed-carbon.py','elecplan-scaffold/scripts/carbon-preview.mjs'}
          with zipfile.ZipFile(bundle) as z:
              assert set(z.namelist()) == allowed
              z.extractall('.')
      - name: Migrate presentation only
        run: python elecplan-scaffold/scripts/migrate-recessed-carbon.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install locked dependencies
        working-directory: elecplan-scaffold
        run: pnpm install --no-frozen-lockfile
      - name: Lint all application source
        working-directory: elecplan-scaffold
        run: pnpm lint
      - name: Build production application and check product boundary
        working-directory: elecplan-scaffold
        run: pnpm build
      - name: Build isolated browser review of real components
        working-directory: elecplan-scaffold
        run: node scripts/carbon-preview.mjs
      - name: Commit validated visual changes to feature branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/elecplan-recessed-carbon-portal'
          git config user.name 'Elecplan theme review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elecplan-scaffold/src elecplan-scaffold/scripts/carbon-preview.mjs elecplan-scaffold/scripts/migrate-recessed-carbon.py
          if ! git diff --cached --quiet; then
            git commit -m 'Apply validated Recessed Carbon design 10 across Elecplan'
            git push origin HEAD:feat/elecplan-recessed-carbon-portal
          fi
      - name: Package review evidence
        if: always()
        run: |
          mkdir -p /tmp/carbon-review
          test ! -d elecplan-scaffold/.carbon-review || cp -r elecplan-scaffold/.carbon-review /tmp/carbon-review/browser
          test ! -f carbon-migration-report.json || cp carbon-migration-report.json /tmp/carbon-review/
          git diff --stat > /tmp/carbon-review/working-tree-stat.txt
          git rev-parse HEAD > /tmp/carbon-review/source-commit.txt
          tar -cf /tmp/carbon-review/source.tar elecplan-scaffold/src elecplan-scaffold/scripts/carbon-preview.mjs elecplan-scaffold/scripts/migrate-recessed-carbon.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carbon-portal-review
          path: /tmp/carbon-review
          retention-days: 2
