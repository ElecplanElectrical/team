<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="RACEEDGE — Horse & Greyhound Tips. Smarter Form. Better Tips. More Winners.">
  <title>RACEEDGE</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-nav="home" aria-label="RaceEdge home">
        <span class="logo-frame"><img id="brandLogo" alt="RaceEdge horse and greyhound logo"></span>
        <span class="brand-copy"><strong><i>RACE</i><b>EDGE</b></strong><small>HORSE &amp; GREYHOUND TIPS</small></span>
      </button>
      <nav class="desktop-nav">
        <button data-nav="home">Home</button>
        <button data-nav="races">Races</button>
        <button data-nav="tips">Tips</button>
        <button data-nav="results">Results</button>
        <button data-nav="more">More</button>
      </nav>
      <div class="live-chip"><span id="liveDot"></span><span id="liveText">CONNECTING</span></div>
    </header>

    <main id="viewRoot" class="view-root" aria-live="polite"></main>

    <nav class="mobile-nav">
      <button data-nav="home"><span>⌂</span><small>Home</small></button>
      <button data-nav="races"><span>◆</span><small>Races</small></button>
      <button data-nav="tips"><span>★</span><small>Tips</small></button>
      <button data-nav="results"><span>▤</span><small>Results</small></button>
      <button data-nav="more"><span>•••</span><small>More</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
